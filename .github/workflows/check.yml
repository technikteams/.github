# On demand and for Renovate branches; people run the gate locally before every merge (handbook CI-1, CI-2).
name: check

on:
  workflow_dispatch:
  # Renovate branches get the full gate; its automerge waits for it (handbook CI-2, DEP-2).
  push:
    branches: ['renovate/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same toolchain as locally, from flake.lock (handbook CODE-9).
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command scripts/check
